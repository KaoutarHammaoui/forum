    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../static/css/home.css ">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Miss+Fajardose&family=Pacifico&family=Sacramento&display=swap" rel="stylesheet">

        <title>Document</title>
    </head>
    <body>
        <div class="container">
        <header>
                    <div class="logo">
                        <p>Forum</p>
                    </div>

                    <div class="search">
                        <input type="text" placeholder="Rechercher..." />
                    </div>

                    <div class="user">
                        <div class="user-avatar">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="8" r="3.5" fill="currentColor" opacity="0.9"/>
                                <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
                            </svg>
                        </div>                        <form action="/logout" method="POST">
                            <button type="submit" class="logout-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </header>
            <div class="main">
                <nav class="sidebar">
                    {{template "ListCategorie" .}}
                </nav>   
                <section class="main-content"> 
                    {{template "CreatePost"  .}}
                    {{template "PostContent" .}}
                </section>
            </div>
        

        </div>
    </body>
    </html>
