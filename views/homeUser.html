<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/home.css ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Miss+Fajardose&family=Pacifico&family=Sacramento&display=swap" rel="stylesheet">

    <title>Document</title>
</head>
<body>
    <div class="container">
       <header>
                <div class="logo">
                    <p>Forum</p>
                </div>

                <div class="search">
                    <input type="text" placeholder="Rechercher..." />
                </div>

                <div class="user">
                    <img src="../static/css/WhatsApp Image 2026-04-10 at 18.26.09.jpeg" alt="user" />
                    <form action="/logout" method="POST"><button type="submit"><svg class="logout-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg></button></form>
                </div>
            </header>
        <div class="main">
              <nav class="sidebar">

            </nav>      
            <section class="main-content">
              <form action="/homeUser" method="POST" enctype="multipart/form-data">
                    <p class="form-subtitle">New publication</p>
                            <h2 class="form-heading">Create <span>New Post</span></h2>

                                <div class="field">
                                    <label for="post-title">Title</label>
                                    <input type="text" id="post-title" name="title" placeholder="Enter post title..." required />
                                </div>

                                <div class="field">
                                    <label for="post-content">Content</label>
                                    <textarea id="post-content" name="content" placeholder="Write your post content here..." required></textarea>
                                </div>

                                <div class="field">
                                    <label>Image </label>
                                    <div class="file-zone" id="drop-zone">
                                        <input type="file" name="image" accept="image/*" id="file-input" />
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                                            <circle cx="8.5" cy="8.5" r="1.5"/>
                                            <polyline points="21 15 16 10 5 21"/>
                                        </svg>
                                        <p>Click to upload or drag &amp; drop</p>
                                        <p class="file-hint">PNG, JPG, WEBP — max 5MB</p>
                                        <p class="file-name" id="file-name"></p>
                                    </div>
                                </div>
                                <div class="field">
                                    <label>Categories</label>
                                    <div class="categories-grid">
                                        {{range .Categories}}
                                            <label class="category-checkbox">
                                                <input type="checkbox" name="categories" value="{{.IdCat}}" />
                                                <span>{{.Name}}</span>
                                            </label>
                                        {{end}}
                                    </div>
                                </div>
                                <div class="actions">
                                    <button type="reset" class="btn-cancel">Cancel</button>
                                    <button type="submit" class="btn-submit">Publish post</button>
                                </div>
                            </form>
                        
                    <div>
                        <p class="form-subtitle">Posts</p>
                            
                    </div>
            </section>
        </div>
       

    </div>
</body>
</html>
