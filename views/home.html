<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Home</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="auth-container home-container">
        <div class="auth-header">
            <h1>Welcome forum guys :)</h1>
            <p>Create a new post</p>
        </div>

        <form action="/" method="POST" class="auth-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{.Title}}" placeholder="write your title">
                {{if .TitleError}}<span class="error">{{.TitleError}}</span>{{end}}
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" placeholder="write your post">{{.Content}}</textarea>
                {{if .ContentError}}<span class="error">{{.ContentError}}</span>{{end}}
            </div>

            <div class="form-group">
                <label>Categories</label>
                <div class="category-list">
                    {{range .Categories}}
                    <label class="category-item">
                        <input type="checkbox" name="category" value="{{.IdCat}}">
                        <span>{{.Name}}</span>
                    </label>
                    {{end}}
                </div>
                {{if .CategoryError}}<span class="error">{{.CategoryError}}</span>{{end}}
            </div>

            <button type="submit" class="btn-primary">Add post</button>
        </form>

        <div class="auth-footer">
            <a href="/logout">logout</a>
        </div>
    </div>
</body>
</html>
