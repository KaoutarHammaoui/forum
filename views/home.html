<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Forum</title>
</head>
<body>
    <div class="container">
        <header>
                <div class="logo"><p>Forum</p></div>
                <div class="search">
                    <input type="text" placeholder="Search..." />
                </div>
                <div class="user">
                    <a href="/login" class="auth-link login-link">Login</a>
                    <a href="/register" class="auth-link register-link">Register</a>
                </div>
        </header>

        <div class="main">
            <nav class="sidebar">
                <form method="POST" action="/" id="clearForm">
                <div class="sidebar-top">
                    <span class="sidebar-label">Filters</span>
                    <button type="button" class="clear-btn" onclick="clearFilters()">Reset</button>
                </div>
                <div class="filter-block">
                    <span class="filter-group-label">Categories</span>
                    <label class="cat-item">
                        <input type="checkbox" name="category" value="all" id="cat-all" >
                        <span class="check-box">
                            <svg class="check-icon" viewBox="0 0 10 10" fill="none">
                                <polyline points="1.5,5 4,7.5 8.5,2.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="cat-label all-label">All posts</span>
                    </label>
                    <div class="cat-divider"></div>
                    {{ range .Categories }}
                    <label class="cat-item">
                        <input type="checkbox" name="category" value="{{ .IdCat }}">
                        <span class="check-box">
                            <svg class="check-icon" viewBox="0 0 10 10" fill="none">
                                <polyline points="1.5,5 4,7.5 8.5,2.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="cat-label">{{ .Name }}</span>
                    </label>
                    {{ end }}
                </div>
                <button type="submit" class="apply-btn">Apply filters</button>
                </form>
            </nav>

            <section class="main-content">
            <div class="content-header">
                <span class="section-label">Posts</span>
            </div>

            {{ if not .Posts }}
            <div class="no-posts">
                <p>No posts yet.</p>
            </div>
            {{ else }}
            <div class="posts-list">
                {{ range .Posts }}
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="8" r="3.5" fill="currentColor" opacity="0.9"/>
                                <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
                            </svg>
                        </div>                        <div class="post-meta">
                            <span class="post-author">{{ .UserName }}</span>
                            <span class="post-date">{{ .CreatedAt.Format "02 Jan 2006" }}</span>
                        </div>
                    </div>

                    {{ if .Image }}
                    <img class="post-image" src="/{{ .Image }}" alt="post image">
                    {{ end }}

                   <div class="post-body">
                        <h3 class="post-title">{{ .Title }}</h3>
                        <input type="checkbox" class="excerpt-toggle" id="toggle-{{ .IdPost }}">
                        <p class="post-excerpt">{{ .Content }}</p>
                        <label class="see-more-btn" for="toggle-{{ .IdPost }}">
                            <span class="label-more">Voir plus</span>
                            <span class="label-less">Voir moins</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </label>
                    </div>

                
                </div>
                {{ end }}
            </div>
            {{ end }}
            </section>
        </div>
    </div>

    <script>
        function clearFilters() {
            document.querySelectorAll('#clearForm input[type=checkbox]').forEach(cb => cb.checked = false);
        }
    </script>
</body>
</html>
